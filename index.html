<!doctype html>

<style>
:root{--bg:#0b0b0b;--panel:#101010;--line:#242424;--text:#f4f4ef;--muted:#85857f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1200px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:20px}h1{margin:0;font-size:clamp(44px,7vw,78px);line-height:.86;letter-spacing:-.07em}p{max-width:660px;margin:10px 0 0;color:var(--muted);font-size:13px;line-height:1.48}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls input,.controls button{font:inherit;border:1px solid #343434;border-radius:999px;padding:10px 14px}.controls input{width:140px;background:#151515;color:#fff;outline:none}.controls button{background:#f3f3ef;color:#111;cursor:pointer}.controls .ghost{background:#151515;color:#f3f3ef}.layout{display:grid;grid-template-columns:1.04fr .96fr;gap:14px}.hero,.grid{border:1px solid var(--line);border-radius:26px;overflow:hidden;background:#0e0e0e}.hero{display:grid;grid-template-rows:1fr auto;min-height:675px}.heroVisual{min-height:585px;display:grid;place-items:center;padding:18px;background:#0a0a0a}.heroVisual svg{width:min(96%,590px);height:auto;overflow:visible}.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 18px;border-top:1px solid var(--line);background:#101010}.meta small{color:#777}.meta strong{font-size:18px;letter-spacing:-.02em}.badge{font-size:10px;color:#bbb;border:1px solid #343434;border-radius:999px;padding:6px 9px;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;padding:1px;background:#202020;align-content:start}.card{aspect-ratio:1;background:#090909;display:grid;place-items:center;position:relative;overflow:hidden;cursor:pointer;transition:background .15s ease}.card:hover{background:#121212}.card svg{width:94%;height:94%;overflow:visible}.card span{position:absolute;left:9px;bottom:8px;color:#666661;font-size:9px}.note{text-align:center;color:#5e5e5a;font-size:10px;margin-top:12px}.pop{animation:pop .28s cubic-bezier(.2,.85,.25,1.08)}@keyframes pop{from{transform:scale(.83) translateY(6px);opacity:.2}to{transform:scale(1);opacity:1}}@media(max-width:850px){header{align-items:flex-start;flex-direction:column}.layout{grid-template-columns:1fr}.hero{min-height:530px}.heroVisual{min-height:450px}}@media(max-width:520px){.wrap{padding:14px}.grid{grid-template-columns:repeat(2,1fr)}.badge{white-space:normal;text-align:right}}

<body>
<div class="wrap">
<header><div><h1>BEANIE<br>LAB V7.</h1><p>One global light system: upper-left light, lower-right shadow. Every major vector asset uses the same base / highlight / shadow logic. No gradients.</p></div><div class="controls"><input id="seed" value="420"><button class="ghost" id="use">Use seed</button><button id="random">Generate</button></div></header>
<div class="layout"><section class="hero"><div class="heroVisual" id="hero"></div><div class="meta"><div><small>SELECTED</small><br><strong id="name">BEAN #420</strong></div><div class="badge" id="traits">—</div></div></section><section class="grid" id="grid"></section></div>
<div class="note">vector generator prototype · deterministic seed</div>
</div>
<script>
const palettes=[
{name:'LIME',base:'#72d41f',limb:'#59ba19',face:'#102006'},{name:'BLUE',base:'#2aa4e9',limb:'#2188ca',face:'#071722'},{name:'PINK',base:'#ef6898',limb:'#d95182',face:'#2a0d18'},{name:'PURPLE',base:'#8865df',limb:'#7252ca',face:'#160d2b'},{name:'ORANGE',base:'#f58a31',limb:'#dc6d1e',face:'#2b1206'},{name:'MINT',base:'#58cfaf',limb:'#3caf93',face:'#0a211b'},{name:'YELLOW',base:'#e9bf2d',limb:'#d0a31a',face:'#2b2106'},{name:'CORAL',base:'#f16f57',limb:'#d75542',face:'#2c0e09'},{name:'ICE',base:'#a9cdef',limb:'#87afd5',face:'#0c1723'},{name:'COCOA',base:'#68483a',limb:'#55372e',face:'#f5ebe4'},{name:'CHARCOAL',base:'#4b4a50',limb:'#3b3a40',face:'#f7f4ee'},{name:'PEACH',base:'#e9a26f',limb:'#cf8355',face:'#2a160c'}];
const builds=[{name:'CLASSIC',w:[31,34],h:[38,41],waist:[3.2,5.2],top:[0,1.6],belly:[0,2]},{name:'CHONKY',w:[35,38],h:[35,38],waist:[2.2,4.2],top:[0,1.2],belly:[1.5,3.5]},{name:'TALL',w:[29,32],h:[42,46],waist:[3,4.8],top:[0,1.8],belly:[0,1.5]},{name:'SLIM',w:[27,30],h:[39,43],waist:[4.2,6],top:[.5,2],belly:[-1,.7]},{name:'BABY',w:[31,34],h:[33,36],waist:[2.8,4.5],top:[-1,.6],belly:[1,2.5]},{name:'PEAR',w:[31,34],h:[39,42],waist:[3.5,5.5],top:[-2,-.5],belly:[2,4]}];
function hash(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}h+=h<<13;h^=h>>>7;h+=h<<3;h^=h>>>17;h+=h<<5;return h>>>0}function rng(seed){let a=hash(String(seed));return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}const n=(r,a,b)=>a+(b-a)*r(),pick=(r,a)=>a[Math.floor(r()*a.length)];
function clamp(v,a=0,b=255){return Math.max(a,Math.min(b,v))}function rgb(hex){const h=hex.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}function hex(a){return'#'+a.map(v=>Math.round(clamp(v)).toString(16).padStart(2,'0')).join('')}function mix(a,b,t){const A=rgb(a),B=rgb(b);return hex(A.map((v,i)=>v+(B[i]-v)*t))}function material(base){return{base,hi:mix(base,'#ffffff',.28),hi2:mix(base,'#ffffff',.15),shadow:mix(base,'#000000',.20),deep:mix(base,'#000000',.34)}}
const MAT={gold:material('#ffd64f'),red:material('#ff637e'),blue:material('#496fe8'),purple:material('#a962df'),teal:material('#50d5c5'),cream:material('#eee8dc'),brown:material('#d2b98c'),black:material('#29272d'),white:material('#f4f1e9'),green:material('#6fc566')};
function bodyPath(seed){const r=rng(seed+'body-v7'),b=pick(r,builds),cx=60,cy=62,w=n(r,b.w[0],b.w[1]),h=n(r,b.h[0],b.h[1]),waist=n(r,b.waist[0],b.waist[1]),topBias=n(r,b.top[0],b.top[1]),belly=n(r,b.belly[0],b.belly[1]),lean=n(r,-1.7,1.7),left=cx-w,right=cx+w,top=cy-h,bottom=cy+h;const d=[`M ${cx+lean+topBias} ${top}`,`C ${right-10+lean} ${top-1}, ${right+1+lean} ${top+13}, ${right+lean} ${cy-10}`,`C ${right-waist+lean} ${cy+1}, ${right+belly+lean} ${cy+14}, ${right-3+lean} ${bottom-10}`,`C ${right-8+lean} ${bottom+1}, ${cx+11} ${bottom+3}, ${cx} ${bottom+2}`,`C ${cx-13} ${bottom+3}, ${left+7+lean} ${bottom}, ${left+3+lean} ${bottom-11}`,`C ${left-belly+lean} ${cy+15}, ${left+waist+lean} ${cy+2}, ${left+lean} ${cy-10}`,`C ${left-1+lean} ${top+14}, ${left+9+lean} ${top}, ${cx+lean+topBias} ${top}`,'Z'].join(' ');return{d,name:b.name,cx,cy,w,h,left,right,top,bottom,lean}}
function bodySurface(body,mat,clipId){const hi=`M ${body.left+8} ${body.top+18} C ${body.left+14} ${body.top+8}, ${body.cx-7} ${body.top+4}, ${body.cx+8} ${body.top+11} C ${body.cx-3} ${body.top+18}, ${body.left+18} ${body.cy-10}, ${body.left+12} ${body.cy+6} C ${body.left+6} ${body.cy-3}, ${body.left+5} ${body.top+29}, ${body.left+8} ${body.top+18} Z`;const shade=`M ${body.cx+11} ${body.top+9} C ${body.right-6} ${body.top+17}, ${body.right+1} ${body.cy-6}, ${body.right-2} ${body.cy+18} C ${body.right-4} ${body.bottom-8}, ${body.cx+12} ${body.bottom+1}, ${body.cx+5} ${body.bottom+1} C ${body.cx+19} ${body.cy+23}, ${body.cx+21} ${body.cy-1}, ${body.cx+11} ${body.top+9} Z`;const low=`M ${body.left+12} ${body.bottom-17} C ${body.cx-3} ${body.bottom-5}, ${body.cx+15} ${body.bottom-4}, ${body.right-10} ${body.bottom-17} C ${body.right-13} ${body.bottom-5}, ${body.cx+8} ${body.bottom+3}, ${body.cx-7} ${body.bottom+2} C ${body.left+23} ${body.bottom+1}, ${body.left+14} ${body.bottom-8}, ${body.left+12} ${body.bottom-17} Z`;return`<g clip-path="url(#${clipId})"><path d="${hi}" fill="${mat.hi}"/><path d="${shade}" fill="${mat.shadow}"/><path d="${low}" fill="${mat.deep}" opacity=".24"/></g>`}
function armPath(side,pose,body,r){const s=side==='L'?-1:1,ax=body.cx+s*(body.w-3),ay=body.cy+2+n(r,-2,2),len=n(r,17,23);if(pose==='DOWN')return{d:`M ${ax} ${ay} Q ${ax+s*9} ${ay+7} ${ax+s*8} ${ay+len}`,hx:ax+s*8,hy:ay+len,name:'DOWN'};if(pose==='WAVE')return{d:`M ${ax} ${ay} Q ${ax+s*10} ${ay-5} ${ax+s*12} ${ay-17} Q ${ax+s*13} ${ay-23} ${ax+s*8} ${ay-26}`,hx:ax+s*8,hy:ay-26,name:'WAVE'};if(pose==='OUT')return{d:`M ${ax} ${ay} Q ${ax+s*11} ${ay-3} ${ax+s*len} ${ay+2}`,hx:ax+s*len,hy:ay+2,name:'OUT'};return{d:`M ${ax} ${ay} Q ${ax+s*10} ${ay+1} ${ax+s*11} ${ay+11} Q ${ax+s*7} ${ay+14} ${ax+s*3} ${ay+9}`,hx:ax+s*3,hy:ay+9,name:'HIP'}}
function legPath(side,pose,body,r){const s=side==='L'?-1:1,lx=body.cx+s*n(r,9,13),ly=body.bottom-2,len=n(r,13,18);if(pose==='WIDE')return{d:`M ${lx} ${ly} Q ${lx+s*4} ${ly+8} ${lx+s*8} ${ly+len}`,fx:lx+s*8,fy:ly+len,name:'WIDE'};if(pose==='BENT')return{d:`M ${lx} ${ly} Q ${lx+s*2} ${ly+7} ${lx+s*5} ${ly+10} Q ${lx+s*1} ${ly+13} ${lx+s*7} ${ly+len}`,fx:lx+s*7,fy:ly+len,name:'BENT'};return{d:`M ${lx} ${ly} Q ${lx+s*1} ${ly+8} ${lx+s*2} ${ly+len}`,fx:lx+s*2,fy:ly+len,name:'STRAIGHT'}}
function tube(path,mat,width=3){return`<g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="${path}" stroke="${mat.shadow}" stroke-width="${width+1.1}"/><path d="${path}" stroke="${mat.base}" stroke-width="${width}"/><path d="${path}" stroke="${mat.hi}" stroke-width="${Math.max(.8,width*.34)}" transform="translate(-.55 -.65)" opacity=".78"/></g>`}function hand(x,y,mat){return`<g><circle cx="${x}" cy="${y}" r="2.5" fill="${mat.shadow}"/><circle cx="${x-.45}" cy="${y-.55}" r="1.9" fill="${mat.base}"/><circle cx="${x-1}" cy="${y-1.2}" r=".7" fill="${mat.hi}"/></g>`}function foot(x,y,mat){const d=`M ${x-3.3} ${y} Q ${x} ${y+1.4} ${x+4.5} ${y}`;return tube(d,mat,3)}
function face(seed,body,pal){const r=rng(seed+'face-v7'),eyeType=pick(r,['DOT','SLIT','HAPPY','SLEEPY','WIDE']),mouthType=pick(r,['SMILE','OPEN','SMIRK','FLAT','TOOTHY','NONE']),gap=n(r,12,17),ey=body.cy-n(r,9,13),ex1=body.cx-gap/2,ex2=body.cx+gap/2;let eyes='';if(eyeType==='DOT')eyes=`<circle cx="${ex1}" cy="${ey}" r="2.15" fill="${pal.face}"/><circle cx="${ex2}" cy="${ey}" r="2.15" fill="${pal.face}"/>`;if(eyeType==='SLIT')eyes=`<rect x="${ex1-1.7}" y="${ey-4.8}" width="3.4" height="9.6" rx="1.7" fill="${pal.face}"/><rect x="${ex2-1.7}" y="${ey-4.8}" width="3.4" height="9.6" rx="1.7" fill="${pal.face}"/>`;if(eyeType==='HAPPY')eyes=`<path d="M ${ex1-3.5} ${ey+1} Q ${ex1} ${ey-3} ${ex1+3.5} ${ey+1}" fill="none" stroke="${pal.face}" stroke-width="2.4" stroke-linecap="round"/><path d="M ${ex2-3.5} ${ey+1} Q ${ex2} ${ey-3} ${ex2+3.5} ${ey+1}" fill="none" stroke="${pal.face}" stroke-width="2.4" stroke-linecap="round"/>`;if(eyeType==='SLEEPY')eyes=`<path d="M ${ex1-3.8} ${ey} Q ${ex1} ${ey+2} ${ex1+3.8} ${ey}" fill="none" stroke="${pal.face}" stroke-width="2.3" stroke-linecap="round"/><path d="M ${ex2-3.8} ${ey} Q ${ex2} ${ey+2} ${ex2+3.8} ${ey}" fill="none" stroke="${pal.face}" stroke-width="2.3" stroke-linecap="round"/>`;if(eyeType==='WIDE')eyes=`<g><ellipse cx="${ex1}" cy="${ey}" rx="3.2" ry="4.2" fill="#fff"/><ellipse cx="${ex2}" cy="${ey}" rx="3.2" ry="4.2" fill="#fff"/><circle cx="${ex1+.5}" cy="${ey+.6}" r="1.65" fill="${pal.face}"/><circle cx="${ex2+.5}" cy="${ey+.6}" r="1.65" fill="${pal.face}"/><circle cx="${ex1-.4}" cy="${ey-.5}" r=".65" fill="#fff"/><circle cx="${ex2-.4}" cy="${ey-.5}" r=".65" fill="#fff"/></g>`;const my=body.cy+n(r,6,10),mw=n(r,8,12);let mouth='';if(mouthType==='SMILE')mouth=`<path d="M ${body.cx-mw} ${my} Q ${body.cx} ${my+8} ${body.cx+mw} ${my}" fill="none" stroke="${pal.face}" stroke-width="2.3" stroke-linecap="round"/>`;if(mouthType==='OPEN')mouth=`<ellipse cx="${body.cx}" cy="${my+2}" rx="${mw*.65}" ry="${mw*.48}" fill="${pal.face}"/><path d="M ${body.cx-mw*.35} ${my+4} Q ${body.cx} ${my+7} ${body.cx+mw*.35} ${my+4}" fill="none" stroke="#ff9aae" stroke-width="2" stroke-linecap="round"/>`;if(mouthType==='SMIRK')mouth=`<path d="M ${body.cx-mw} ${my+2} Q ${body.cx+1} ${my+5} ${body.cx+mw} ${my-1}" fill="none" stroke="${pal.face}" stroke-width="2.3" stroke-linecap="round"/>`;if(mouthType==='FLAT')mouth=`<path d="M ${body.cx-mw*.75} ${my} H ${body.cx+mw*.75}" stroke="${pal.face}" stroke-width="2.4" stroke-linecap="round"/>`;if(mouthType==='TOOTHY')mouth=`<g><rect x="${body.cx-mw}" y="${my-2}" width="${mw*2}" height="8" rx="4" fill="#fff"/><path d="M ${body.cx} ${my-1} V ${my+5}" stroke="#d6d4ce" stroke-width="1"/></g>`;return{svg:eyes+mouth,eyeType,mouthType,ey}}
function shadedCircle(cx,cy,r,mat){return`<g><circle cx="${cx}" cy="${cy}" r="${r}" fill="${mat.base}"/><path d="M ${cx} ${cy-r} A ${r} ${r} 0 0 1 ${cx+r} ${cy} A ${r} ${r} 0 0 1 ${cx} ${cy+r*.75} Q ${cx+r*.25} ${cy} ${cx} ${cy-r} Z" fill="${mat.shadow}"/><circle cx="${cx-r*.35}" cy="${cy-r*.35}" r="${Math.max(.8,r*.26)}" fill="${mat.hi}"/></g>`}
function headTrait(seed,body){const r=rng(seed+'head-v7'),type=pick(r,['NONE','NONE','NONE','NONE','ANTLERS','PARTY_HAT','CAP','CROWN','TINY_BEANIE','HEADBAND','HALO','DEVIL_HORNS']);const x=body.cx,y=body.top+1;let svg='';if(type==='ANTLERS'){const l=`M ${x-15} ${y+3} Q ${x-21} ${y-7} ${x-22} ${y-17} M ${x-22} ${y-11} L ${x-29} ${y-16} M ${x-21} ${y-7} L ${x-14} ${y-13}`,rr=`M ${x+15} ${y+3} Q ${x+21} ${y-7} ${x+22} ${y-17} M ${x+22} ${y-11} L ${x+29} ${y-16} M ${x+21} ${y-7} L ${x+14} ${y-13}`;svg=tube(l,MAT.brown,3.2)+tube(rr,MAT.brown,3.2)}if(type==='PARTY_HAT'){const m=MAT.red,gm=MAT.gold,tm=MAT.teal;svg=`<g><path d="M ${x-13} ${y+2} L ${x} ${y-29} L ${x+14} ${y+2} Z" fill="${m.base}"/><path d="M ${x+1} ${y-27} L ${x+14} ${y+2} L ${x+5} ${y+2} Z" fill="${m.shadow}"/><path d="M ${x-10} ${y-1} L ${x-1} ${y-23} L ${x+1} ${y-18} L ${x-5} ${y} Z" fill="${m.hi}"/><path d="M ${x-9} ${y-8} L ${x+8} ${y-14} L ${x+10} ${y-10} L ${x-7} ${y-4} Z" fill="${gm.base}"/><path d="M ${x+7} ${y-14} L ${x+10} ${y-10} L ${x+5} ${y-8} Z" fill="${gm.shadow}"/>${shadedCircle(x,y-31,4,tm)}</g>`}if(type==='CAP'){const m=MAT.blue;svg=`<g><path d="M ${x-18} ${y+1} Q ${x-12} ${y-15} ${x+7} ${y-14} Q ${x+19} ${y-12} ${x+18} ${y+2} Z" fill="${m.base}"/><path d="M ${x+2} ${y-14} Q ${x+17} ${y-12} ${x+18} ${y+2} L ${x+7} ${y+2} Q ${x+12} ${y-7} ${x+2} ${y-14} Z" fill="${m.shadow}"/><path d="M ${x-14} ${y-1} Q ${x-10} ${y-11} ${x} ${y-12} Q ${x-6} ${y-7} ${x-8} ${y} Z" fill="${m.hi}"/><path d="M ${x+5} ${y-1} Q ${x+21} ${y-1} ${x+27} ${y+5} Q ${x+15} ${y+8} ${x+4} ${y+4} Z" fill="${m.base}"/><path d="M ${x+12} ${y+3} Q ${x+23} ${y+2} ${x+27} ${y+5} Q ${x+17} ${y+8} ${x+8} ${y+5} Z" fill="${m.shadow}"/></g>`}if(type==='CROWN'){const m=MAT.gold,gem=MAT.red;svg=`<g><path d="M ${x-17} ${y+2} L ${x-15} ${y-17} L ${x-6} ${y-7} L ${x} ${y-22} L ${x+7} ${y-7} L ${x+16} ${y-17} L ${x+18} ${y+2} Z" fill="${m.base}"/><path d="M ${x+1} ${y-20} L ${x+7} ${y-7} L ${x+16} ${y-17} L ${x+18} ${y+2} L ${x+5} ${y+2} Q ${x+9} ${y-6} ${x+1} ${y-20} Z" fill="${m.shadow}"/><path d="M ${x-14} ${y-13} L ${x-7} ${y-5} L ${x-2} ${y-17} L ${x-1} ${y-10} L ${x-5} ${y-1} L ${x-14} ${y-1} Z" fill="${m.hi}"/>${shadedCircle(x,y-10,2.8,gem)}</g>`}if(type==='TINY_BEANIE'){const m=MAT.purple;svg=`<g><path d="M ${x-15} ${y+2} Q ${x-13} ${y-15} ${x} ${y-18} Q ${x+14} ${y-14} ${x+15} ${y+2} Z" fill="${m.base}"/><path d="M ${x+1} ${y-18} Q ${x+14} ${y-14} ${x+15} ${y+2} L ${x+6} ${y+2} Q ${x+9} ${y-9} ${x+1} ${y-18} Z" fill="${m.shadow}"/><path d="M ${x-11} ${y-1} Q ${x-9} ${y-11} ${x-1} ${y-14} Q ${x-5} ${y-8} ${x-5} ${y} Z" fill="${m.hi}"/><rect x="${x-16}" y="${y-2}" width="32" height="7" rx="3.5" fill="${m.base}"/><path d="M ${x+1} ${y-2} H ${x+16} V ${y+2} Q ${x+11} ${y+5} ${x+1} ${y+5} Z" fill="${m.shadow}"/>${shadedCircle(x,y-20,4,m)}</g>`}if(type==='HEADBAND'){const m=MAT.blue,wm=MAT.white;svg=`<g><path d="M ${body.left-3} ${y+9} Q ${x} ${y+1} ${body.right+3} ${y+8} L ${body.right+5} ${y+16} Q ${x} ${y+9} ${body.left-5} ${y+17} Z" fill="${wm.base}"/><path d="M ${body.left-4} ${y+12} Q ${x} ${y+5} ${body.right+4} ${y+11} L ${body.right+5} ${y+14} Q ${x} ${y+8} ${body.left-5} ${y+15} Z" fill="${m.base}"/><path d="M ${x+2} ${y+5} Q ${body.right-5} ${y+6} ${body.right+4} ${y+11} L ${body.right+5} ${y+14} Q ${body.right-6} ${y+10} ${x+2} ${y+9} Z" fill="${m.shadow}"/><path d="M ${body.left} ${y+10} Q ${x-8} ${y+5} ${x-1} ${y+5} L ${x-5} ${y+9} Q ${x-13} ${y+9} ${body.left-2} ${y+14} Z" fill="${wm.hi}"/></g>`}if(type==='HALO'){const m=MAT.gold;svg=`<g><ellipse cx="${x}" cy="${y-14}" rx="19" ry="6" fill="none" stroke="${m.shadow}" stroke-width="5"/><ellipse cx="${x-.6}" cy="${y-14.7}" rx="19" ry="6" fill="none" stroke="${m.base}" stroke-width="3.5"/><path d="M ${x-15} ${y-16} Q ${x-6} ${y-20} ${x+1} ${y-19}" fill="none" stroke="${m.hi}" stroke-width="1.2" stroke-linecap="round"/></g>`}if(type==='DEVIL_HORNS'){const m=MAT.red;svg=`<g><path d="M ${x-16} ${y+2} Q ${x-22} ${y-8} ${x-17} ${y-19} Q ${x-9} ${y-9} ${x-7} ${y+1} Z" fill="${m.base}"/><path d="M ${x-17} ${y-18} Q ${x-9} ${y-9} ${x-7} ${y+1} L ${x-12} ${y} Q ${x-14} ${y-8} ${x-17} ${y-18} Z" fill="${m.shadow}"/><path d="M ${x+16} ${y+2} Q ${x+22} ${y-8} ${x+17} ${y-19} Q ${x+9} ${y-9} ${x+7} ${y+1} Z" fill="${m.base}"/><path d="M ${x+17} ${y-18} Q ${x+22} ${y-8} ${x+16} ${y+2} L ${x+11} ${y} Q ${x+15} ${y-8} ${x+17} ${y-18} Z" fill="${m.shadow}"/><path d="M ${x-18} ${y-14} Q ${x-15} ${y-10} ${x-13} ${y-5}" fill="none" stroke="${m.hi}" stroke-width="1.5" stroke-linecap="round"/></g>`}return{svg,type}}
function facewear(seed,body,faceData){const r=rng(seed+'facewear-v7'),type=pick(r,['NONE','NONE','NONE','ROUND_GLASSES','SUNGLASSES','EYE_PATCH']);const y=faceData.ey;let svg='';if(type==='ROUND_GLASSES'){const m=MAT.white;const l=`M ${body.cx-14} ${y} A 6 6 0 1 0 ${body.cx-2} ${y} A 6 6 0 1 0 ${body.cx-14} ${y}`,rr=`M ${body.cx+2} ${y} A 6 6 0 1 0 ${body.cx+14} ${y} A 6 6 0 1 0 ${body.cx+2} ${y}`,bridge=`M ${body.cx-2} ${y} H ${body.cx+2}`;svg=tube(l,m,2)+tube(rr,m,2)+tube(bridge,m,2)}if(type==='SUNGLASSES'){const m=MAT.black;svg=`<g><rect x="${body.cx-16}" y="${y-5}" width="13" height="9" rx="3" fill="${m.base}"/><rect x="${body.cx+3}" y="${y-5}" width="13" height="9" rx="3" fill="${m.base}"/><path d="M ${body.cx-3} ${y-2} H ${body.cx+3}" stroke="${m.shadow}" stroke-width="2.5"/><path d="M ${body.cx-13} ${y-3} H ${body.cx-7}" stroke="${m.hi}" stroke-width="1.4" stroke-linecap="round"/><path d="M ${body.cx+6} ${y-3} H ${body.cx+12}" stroke="${m.hi}" stroke-width="1.4" stroke-linecap="round"/></g>`}if(type==='EYE_PATCH'){const m=MAT.black;svg=`<g>${tube(`M ${body.cx-14} ${y-9} Q ${body.cx+2} ${y-5} ${body.cx+15} ${y-8}`,m,1.8)}<circle cx="${body.cx+8}" cy="${y}" r="6" fill="${m.base}"/><path d="M ${body.cx+8} ${y-6} A 6 6 0 0 1 ${body.cx+14} ${y} A 6 6 0 0 1 ${body.cx+8} ${y+6} Q ${body.cx+11} ${y} ${body.cx+8} ${y-6} Z" fill="${m.shadow}"/><circle cx="${body.cx+6}" cy="${y-2}" r="1.1" fill="${m.hi}"/></g>`}return{svg,type}}
function neckTrait(seed,body){const r=rng(seed+'neck-v7'),type=pick(r,['NONE','NONE','NONE','BOWTIE','SCARF','COLLAR','MEDAL']);const y=body.cy+22;let svg='';if(type==='BOWTIE'){const m=MAT.red;svg=`<g><path d="M 60 ${y} L 49 ${y-7} L 48 ${y+7} Z" fill="${m.base}"/><path d="M 49 ${y-7} L 60 ${y} L 52 ${y+2} L 48 ${y+7} Z" fill="${m.shadow}"/><path d="M 60 ${y} L 71 ${y-7} L 72 ${y+7} Z" fill="${m.base}"/><path d="M 62 ${y} L 71 ${y-7} L 72 ${y+7} L 65 ${y+2} Z" fill="${m.shadow}"/>${shadedCircle(60,y,4,m)}</g>`}if(type==='SCARF'){const m=MAT.gold;svg=`<g><path d="M 39 ${y-5} Q 60 ${y+5} 81 ${y-5} L 78 ${y+3} Q 59 ${y+11} 41 ${y+3} Z" fill="${m.base}"/><path d="M 61 ${y+5} Q 72 ${y+4} 78 ${y} L 81 ${y-5} Q 72 ${y} 61 ${y} Z" fill="${m.shadow}"/><path d="M 43 ${y-3} Q 52 ${y+1} 59 ${y+1}" fill="none" stroke="${m.hi}" stroke-width="2" stroke-linecap="round"/><path d="M 72 ${y+1} L 80 ${y+21} L 71 ${y+18} Z" fill="${m.base}"/><path d="M 76 ${y+8} L 80 ${y+21} L 74 ${y+19} Z" fill="${m.shadow}"/></g>`}if(type==='COLLAR'){const m=MAT.white;svg=`<g><path d="M 43 ${y-4} L 55 ${y+4} L 60 ${y-1} L 66 ${y+4} L 78 ${y-4}" fill="none" stroke="${m.shadow}" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 43 ${y-5} L 55 ${y+3} L 60 ${y-2} L 66 ${y+3} L 78 ${y-5}" fill="none" stroke="${m.base}" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 45 ${y-6} L 54 ${y}" fill="none" stroke="${m.hi}" stroke-width="1.1" stroke-linecap="round"/></g>`}if(type==='MEDAL'){const ribbon=MAT.blue,med=MAT.gold;svg=`<g><path d="M 53 ${y-8} L 58 ${y+5} L 62 ${y+5} L 68 ${y-8}" fill="none" stroke="${ribbon.base}" stroke-width="5" stroke-linecap="round"/><path d="M 65 ${y-7} L 61 ${y+4}" fill="none" stroke="${ribbon.shadow}" stroke-width="2" stroke-linecap="round"/>${shadedCircle(60,y+10,6,med)}</g>`}return{svg,type}}
function chestTrait(seed,body){const r=rng(seed+'chest-v7'),type=pick(r,['NONE','NONE','NONE','HEART','STAR','PATCH']);const x=body.cx-17,y=body.cy+15;let svg='';if(type==='HEART'){const m=MAT.red;svg=`<g><path d="M ${x} ${y+7} C ${x-11} ${y}, ${x-5} ${y-9}, ${x} ${y-3} C ${x+5} ${y-9}, ${x+11} ${y}, ${x} ${y+7} Z" fill="${m.base}"/><path d="M ${x} ${y-3} C ${x+6} ${y-9}, ${x+11} ${y}, ${x} ${y+7} Q ${x+4} ${y+1} ${x} ${y-3} Z" fill="${m.shadow}"/><path d="M ${x-5} ${y-4} Q ${x-2} ${y-6} ${x} ${y-4}" fill="none" stroke="${m.hi}" stroke-width="1.2" stroke-linecap="round"/></g>`}if(type==='STAR'){const m=MAT.gold;svg=`<g><path d="M ${x} ${y-8} L ${x+2.7} ${y-2.6} L ${x+8.5} ${y-1.7} L ${x+4.2} ${y+2.4} L ${x+5.2} ${y+8} L ${x} ${y+5.3} L ${x-5.2} ${y+8} L ${x-4.2} ${y+2.4} L ${x-8.5} ${y-1.7} L ${x-2.7} ${y-2.6} Z" fill="${m.base}"/><path d="M ${x} ${y-8} L ${x+2.7} ${y-2.6} L ${x+8.5} ${y-1.7} L ${x+4.2} ${y+2.4} L ${x+5.2} ${y+8} L ${x} ${y+5.3} Z" fill="${m.shadow}"/><path d="M ${x-3} ${y-3} L ${x} ${y-6}" stroke="${m.hi}" stroke-width="1.3" stroke-linecap="round"/></g>`}if(type==='PATCH'){const m=MAT.teal;svg=`<g><rect x="${x-8}" y="${y-6}" width="16" height="12" rx="4" fill="${m.base}"/><path d="M ${x+1} ${y-6} H ${x+4} Q ${x+8} ${y-6} ${x+8} ${y-2} V ${y+2} Q ${x+8} ${y+6} ${x+4} ${y+6} H ${x+1} Z" fill="${m.shadow}"/><path d="M ${x-5} ${y-3} H ${x-1}" stroke="${m.hi}" stroke-width="1.4" stroke-linecap="round"/></g>`}return{svg,type}}
function make(seed){const style=rng(seed+'style-v7'),pal=pick(style,palettes),bm=material(pal.base),lm=material(pal.limb),body=bodyPath(seed),armR=rng(seed+'arms-v7'),legR=rng(seed+'legs-v7'),leftArm=armPath('L',pick(armR,['DOWN','WAVE','OUT','HIP']),body,armR),rightArm=armPath('R',pick(armR,['DOWN','WAVE','OUT','HIP']),body,armR),leftLeg=legPath('L',pick(legR,['STRAIGHT','WIDE','BENT']),body,legR),rightLeg=legPath('R',pick(legR,['STRAIGHT','WIDE','BENT']),body,legR),f=face(seed,body,pal),head=headTrait(seed,body),wear=facewear(seed,body,f),neck=neckTrait(seed,body),chest=chestTrait(seed,body),clip='clip'+hash(seed+'clip-v7').toString(36),tilt=n(style,-2.4,2.4);const defs=`<defs><clipPath id="${clip}"><path d="${body.d}"/></clipPath></defs>`;const limbs=tube(leftArm.d,lm,3)+tube(rightArm.d,lm,3)+tube(leftLeg.d,lm,3)+tube(rightLeg.d,lm,3)+hand(leftArm.hx,leftArm.hy,lm)+hand(rightArm.hx,rightArm.hy,lm)+foot(leftLeg.fx,leftLeg.fy,lm)+foot(rightLeg.fx,rightLeg.fy,lm);const bodySvg=`<path d="${body.d}" fill="${bm.base}"/>${bodySurface(body,bm,clip)}`;const svg=`<svg viewBox="0 -26 120 165" xmlns="http://www.w3.org/2000/svg" aria-label="Bean ${seed}">${defs}<g transform="rotate(${tilt.toFixed(2)} 60 66)">${head.svg}${limbs}${bodySvg}${chest.svg}${neck.svg}${f.svg}${wear.svg}</g></svg>`;return{svg,traits:`${body.name} · ${pal.name} · HEAD:${head.type} · FACE:${wear.type} · NECK:${neck.type} · CHEST:${chest.type}`}}
function show(seed,anim=true){const x=make(seed),h=document.getElementById('hero');h.innerHTML=x.svg;if(anim)h.firstElementChild.classList.add('pop');document.getElementById('name').textContent='BEAN #'+seed;document.getElementById('traits').textContent=x.traits;document.getElementById('seed').value=seed}function fillGrid(base){const g=document.getElementById('grid');g.innerHTML='';let start=Number(base)||1;for(let i=0;i<18;i++){const seed=String(start+i),x=make(seed),c=document.createElement('div');c.className='card';c.innerHTML=x.svg+`<span>#${seed}</span>`;c.onclick=()=>show(seed);g.appendChild(c)}}function selfCheck(){const samples=['1','2','3','4','5','420','777','1337','9999'].map(make);const joined=samples.map(x=>x.svg).join('');return{noGradients:!/(linearGradient|radialGradient)/.test(joined),allSvg:samples.every(x=>x.svg.startsWith('<svg')),materialLayers:samples.every(x=>x.svg.includes('clipPath'))}}const qa=selfCheck();if(!qa.noGradients||!qa.allSvg||!qa.materialLayers)console.warn('Beanie QA failed',qa);document.getElementById('use').onclick=()=>{const s=document.getElementById('seed').value.trim()||'1';show(s);fillGrid(s)};document.getElementById('random').onclick=()=>{const s=Math.floor(Math.random()*99999)+1;show(s);fillGrid(s)};document.getElementById('seed').onkeydown=e=>{if(e.key==='Enter')document.getElementById('use').click()};show('420',false);fillGrid(420);
</script>
