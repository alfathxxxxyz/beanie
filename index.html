<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beanie Lab</title>
<style>
:root{--ink:#171714;--paper:#f2efe6;--panel:#fffdf7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}h1{margin:0;font-size:clamp(46px,7vw,80px);line-height:.86;letter-spacing:-.07em}p{max-width:540px;font-size:14px;line-height:1.45;opacity:.62}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls input,.controls button{border:1.5px solid var(--ink);border-radius:999px;padding:10px 14px;font:inherit}.controls input{width:135px;background:var(--panel)}.controls button{background:var(--ink);color:white;cursor:pointer}.controls .ghost{background:var(--panel);color:var(--ink)}.layout{display:grid;grid-template-columns:1.05fr .95fr;gap:16px}.hero,.grid{background:var(--panel);border:1.5px solid var(--ink);border-radius:28px;overflow:hidden}.hero{display:grid;grid-template-rows:1fr auto;min-height:620px}.heroVisual{min-height:535px;display:grid;place-items:center;padding:28px}.heroVisual svg{width:min(92%,520px);filter:drop-shadow(0 16px 0 rgba(20,20,16,.08))}.meta{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-top:1.5px solid var(--ink)}.meta strong{font-size:19px}.badge{font-size:11px;border:1px solid var(--ink);border-radius:999px;padding:6px 9px;background:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px;align-content:start}.card{aspect-ratio:1;border-radius:20px;border:1px solid rgba(20,20,16,.25);display:grid;place-items:center;position:relative;overflow:hidden;cursor:pointer;transition:.16s}.card:hover{transform:translateY(-2px);box-shadow:0 6px 0 rgba(20,20,16,.12)}.card svg{width:88%;height:88%}.card span{position:absolute;left:9px;bottom:8px;background:rgba(255,255,255,.78);padding:4px 7px;border-radius:999px;font-size:10px}.note{text-align:center;font-size:11px;opacity:.5;margin-top:12px}.pop{animation:pop .32s cubic-bezier(.2,.9,.2,1.18)}@keyframes pop{from{transform:scale(.78) rotate(-4deg);opacity:.2}to{transform:scale(1);opacity:1}}@media(max-width:860px){header{align-items:flex-start;flex-direction:column}.layout{grid-template-columns:1fr}.hero{min-height:500px}.heroVisual{min-height:420px}}@media(max-width:520px){.wrap{padding:16px}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><div class="wrap"><header><div><h1>BEANIE<br>LAB.</h1><p>Procedural Beanheads. Same seed = same bean. The body silhouette itself changes, so this is not just fixed image layers.</p></div><div class="controls"><input id="seed" value="420"><button class="ghost" id="use">Use seed</button><button id="random">Generate</button></div></header><div class="layout"><section class="hero"><div class="heroVisual" id="hero"></div><div class="meta"><div><small>SELECTED</small><br><strong id="name">BEAN #420</strong></div><div class="badge" id="traits">—</div></div></section><section class="grid" id="grid"></section></div><div class="note">visual generator prototype only — no minting, contract, backend, or metadata storage</div></div>
<script>
const palettes=[['#8fd34f','#d9ff98','#243018'],['#ff8f70','#ffd3c1','#3e1a12'],['#78b6ff','#d4e8ff','#10243c'],['#d197ff','#f0d8ff','#2e173d'],['#ffd557','#fff0aa','#3b2b0d'],['#66d7bf','#cafff0','#12352e'],['#ff7eaa','#ffd3e1','#3e1422'],['#b9bcc1','#eef0f2','#252629']],bgs=['#e7dfcf','#dcead5','#dce6f5','#f1d9d3','#e7dcf1','#efe8c7','#d9ece9','#dfdfdf'];
function hash(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}h+=h<<13;h^=h>>>7;h+=h<<3;h^=h>>>17;h+=h<<5;return h>>>0}function rng(seed){let a=hash(String(seed));return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}const n=(r,a,b)=>a+(b-a)*r(),pick=(r,a)=>a[Math.floor(r()*a.length)];
function path(p){let d=`M ${p[0][0]} ${p[0][1]}`,L=p.length;for(let i=0;i<L;i++){let p0=p[(i-1+L)%L],p1=p[i],p2=p[(i+1)%L],p3=p[(i+2)%L],c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];d+=` C ${c1[0].toFixed(1)} ${c1[1].toFixed(1)}, ${c2[0].toFixed(1)} ${c2[1].toFixed(1)}, ${p2[0]} ${p2[1]}`}return d+' Z'}
function body(seed){const r=rng(seed+'body'),cx=50,top=n(r,8,14),bottom=n(r,87,94),wide=n(r,26,34),lean=n(r,-5,5),side=r()>.5?1:-1,pinch=n(r,8,15),bulge=n(r,3,8);let p=[[cx+lean,top],[cx+wide*.7+lean,n(r,14,22)],[cx+wide+lean,n(r,31,41)],[cx+wide*.86+lean,n(r,54,63)],[cx+wide*.45+lean,n(r,76,84)],[cx+lean,bottom],[cx-wide*.58+lean,n(r,82,88)],[cx-wide*.9+lean,n(r,65,75)],[cx-wide+lean,n(r,46,56)],[cx-wide*.78+lean,n(r,27,35)]];if(side===1){p[3][0]-=pinch;p[8][0]-=bulge}else{p[8][0]+=pinch;p[3][0]+=bulge}return{d:path(p),wide,lean,side}}
function eyes(seed,ink){const r=rng(seed+'eyes'),s=Math.floor(r()*5),gap=n(r,10,17),y=n(r,43,50),z=n(r,2.3,4.1),x1=50-gap/2,x2=50+gap/2;if(s===0)return`<circle cx="${x1}" cy="${y}" r="${z}" fill="${ink}"/><circle cx="${x2}" cy="${y}" r="${z}" fill="${ink}"/>`;if(s===1)return`<path d="M${x1-4} ${y}q4 4 8 0M${x2-4} ${y}q4 4 8 0" fill="none" stroke="${ink}" stroke-width="2.4" stroke-linecap="round"/>`;if(s===2)return`<ellipse cx="${x1}" cy="${y}" rx="${z*1.3}" ry="${z*.65}" fill="${ink}"/><ellipse cx="${x2}" cy="${y}" rx="${z*1.3}" ry="${z*.65}" fill="${ink}"/>`;if(s===3)return`<circle cx="${x1}" cy="${y}" r="${z+1}" fill="white" stroke="${ink}" stroke-width="1.7"/><circle cx="${x2}" cy="${y}" r="${z+1}" fill="white" stroke="${ink}" stroke-width="1.7"/><circle cx="${x1+1}" cy="${y+1}" r="1.5" fill="${ink}"/><circle cx="${x2+1}" cy="${y+1}" r="1.5" fill="${ink}"/>`;return`<circle cx="50" cy="${y}" r="${z+2}" fill="white" stroke="${ink}" stroke-width="2"/><circle cx="51" cy="${y+1}" r="2" fill="${ink}"/>`}
function mouth(seed,ink){const r=rng(seed+'mouth'),s=Math.floor(r()*5),y=n(r,57,65),w=n(r,7,13);if(s===0)return`<path d="M${50-w} ${y}Q50 ${y+7} ${50+w} ${y}" fill="none" stroke="${ink}" stroke-width="2.5" stroke-linecap="round"/>`;if(s===1)return`<path d="M${50-w} ${y+4}Q50 ${y-3} ${50+w} ${y+4}" fill="none" stroke="${ink}" stroke-width="2.5" stroke-linecap="round"/>`;if(s===2)return`<ellipse cx="50" cy="${y+2}" rx="${w*.72}" ry="${w*.45}" fill="${ink}"/>`;if(s===3)return`<path d="M${50-w} ${y}H${50+w}" stroke="${ink}" stroke-width="2.8" stroke-linecap="round"/>`;return`<path d="M${50-w} ${y}q${w*.55} 5 ${w} 0q${w*.55} 5 ${w} 0" fill="none" stroke="${ink}" stroke-width="2.3" stroke-linecap="round"/>`}
function marks(seed,light,ink){const r=rng(seed+'mark'),s=Math.floor(r()*4);if(s===0)return'';if(s===1)return`<circle cx="34" cy="31" r="6" fill="${light}" opacity=".6"/><circle cx="66" cy="72" r="4" fill="${light}" opacity=".5"/>`;if(s===2)return`<path d="M29 29Q38 23 43 30" fill="none" stroke="${ink}" stroke-width="2" opacity=".45" stroke-linecap="round"/>`;return`<circle cx="33" cy="61" r="2.2" fill="${ink}" opacity=".35"/><circle cx="38" cy="65" r="1.5" fill="${ink}" opacity=".35"/><circle cx="67" cy="34" r="1.8" fill="${ink}" opacity=".3"/>`}
function make(seed){const r=rng(seed+'style'),pal=pick(r,palettes),bg=pick(r,bgs),b=body(seed),rot=n(r,-5,5).toFixed(1);const svg=`<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g transform="rotate(${rot} 50 50)"><path d="${b.d}" fill="${pal[0]}" stroke="${pal[2]}" stroke-width="2.4" stroke-linejoin="round"/>${marks(seed,pal[1],pal[2])}${eyes(seed,pal[2])}${mouth(seed,pal[2])}</g></svg>`;return{svg,bg,traits:[b.wide>30?'CHONKY':'SLIM',Math.abs(b.lean)>3?'LEANING':'UPRIGHT',b.side===1?'RIGHT PINCH':'LEFT PINCH'].join(' · ')}}
function show(seed,anim=true){const x=make(seed),h=document.getElementById('hero');h.style.background=x.bg;h.innerHTML=x.svg;if(anim)h.firstElementChild.classList.add('pop');document.getElementById('name').textContent='BEAN #'+seed;document.getElementById('traits').textContent=x.traits;document.getElementById('seed').value=seed}function fill(base){const g=document.getElementById('grid');g.innerHTML='';let start=Number(base)||1;for(let i=0;i<12;i++){let seed=String(start+i),x=make(seed),c=document.createElement('div');c.className='card';c.style.background=x.bg;c.innerHTML=x.svg+`<span>#${seed}</span>`;c.onclick=()=>show(seed);g.appendChild(c)}}document.getElementById('use').onclick=()=>{let s=document.getElementById('seed').value.trim()||'1';show(s);fill(s)};document.getElementById('random').onclick=()=>{let s=Math.floor(Math.random()*99999)+1;show(s);fill(s)};document.getElementById('seed').onkeydown=e=>{if(e.key==='Enter')document.getElementById('use').click()};show('420',false);fill(420);
</script></body></html>
