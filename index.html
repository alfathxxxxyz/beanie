<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beanie Lab — V2</title>
<style>
:root{--ink:#181816;--paper:#efede7;--panel:#fffdfa}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1200px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:24px}h1{margin:0;font-size:clamp(48px,7vw,84px);line-height:.84;letter-spacing:-.075em}p{max-width:560px;font-size:14px;line-height:1.5;opacity:.62}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls input,.controls button{border:1.5px solid var(--ink);border-radius:999px;padding:10px 14px;font:inherit}.controls input{width:140px;background:var(--panel);outline:none}.controls button{background:var(--ink);color:#fff;cursor:pointer}.controls .ghost{background:var(--panel);color:var(--ink)}.layout{display:grid;grid-template-columns:1.05fr .95fr;gap:16px}.hero,.grid{background:var(--panel);border:1.5px solid var(--ink);border-radius:28px;overflow:hidden}.hero{display:grid;grid-template-rows:1fr auto;min-height:640px}.heroVisual{min-height:550px;display:grid;place-items:center;padding:30px;transition:background .25s ease}.heroVisual svg{width:min(92%,530px);overflow:visible}.meta{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 20px;border-top:1.5px solid var(--ink)}.meta strong{font-size:19px;letter-spacing:-.025em}.badge{font-size:10px;border:1px solid var(--ink);border-radius:999px;padding:7px 10px;background:rgba(255,255,255,.78);white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px;align-content:start}.card{aspect-ratio:1;border-radius:21px;border:1px solid rgba(20,20,16,.22);display:grid;place-items:center;position:relative;overflow:hidden;cursor:pointer;transition:.18s ease}.card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% 18%,rgba(255,255,255,.35),transparent 28%);pointer-events:none}.card:hover{transform:translateY(-3px);box-shadow:0 8px 0 rgba(20,20,16,.10)}.card svg{width:88%;height:88%;position:relative;z-index:1}.card span{position:absolute;z-index:2;left:9px;bottom:8px;background:rgba(255,255,255,.72);backdrop-filter:blur(7px);padding:4px 7px;border:1px solid rgba(20,20,16,.08);border-radius:999px;font-size:10px}.note{text-align:center;font-size:11px;opacity:.48;margin-top:12px}.pop{animation:pop .4s cubic-bezier(.18,.9,.2,1.16)}@keyframes pop{0%{transform:scale(.72) rotate(-5deg);opacity:.15}70%{transform:scale(1.035) rotate(1deg);opacity:1}100%{transform:scale(1);opacity:1}}@media(max-width:860px){header{align-items:flex-start;flex-direction:column}.layout{grid-template-columns:1fr}.hero{min-height:510px}.heroVisual{min-height:430px}}@media(max-width:520px){.wrap{padding:16px}.grid{grid-template-columns:repeat(2,1fr)}.badge{white-space:normal;text-align:right}}
</style>
</head>
<body><div class="wrap"><header><div><h1>BEANIE<br>LAB V2.</h1><p>Controlled procedural Beanheads: six designed body families, soft depth, richer faces, and deterministic traits. Same seed = same bean.</p></div><div class="controls"><input id="seed" value="420"><button class="ghost" id="use">Use seed</button><button id="random">Generate</button></div></header><div class="layout"><section class="hero"><div class="heroVisual" id="hero"></div><div class="meta"><div><small>SELECTED</small><br><strong id="name">BEAN #420</strong></div><div class="badge" id="traits">—</div></div></section><section class="grid" id="grid"></section></div><div class="note">visual generator prototype only — no minting, contract, backend, or metadata storage</div></div>
<script>
const palettes=[
 {name:'MATCHA',base:'#86c94f',light:'#d8ff9f',dark:'#4f8729',ink:'#213017',bg1:'#dcebcf',bg2:'#bcd7a8'},
 {name:'TANGERINE',base:'#ff9272',light:'#ffd7c7',dark:'#d95742',ink:'#3d1913',bg1:'#f4ded6',bg2:'#e9b9ab'},
 {name:'POOL',base:'#72b8ff',light:'#d9edff',dark:'#377bd0',ink:'#10263f',bg1:'#dae8f5',bg2:'#b4d1e9'},
 {name:'GRAPE',base:'#c894ff',light:'#efd9ff',dark:'#8755cb',ink:'#2e183e',bg1:'#eadcf3',bg2:'#ceb8df'},
 {name:'YOLK',base:'#ffd45b',light:'#fff1aa',dark:'#d69a25',ink:'#3b2a0c',bg1:'#f1e9ca',bg2:'#dfce8e'},
 {name:'AQUA',base:'#5fd4bc',light:'#cafff2',dark:'#2e947f',ink:'#12362e',bg1:'#d9ece8',bg2:'#add7ce'},
 {name:'BUBBLEGUM',base:'#ff7fae',light:'#ffd4e2',dark:'#ca4678',ink:'#3f1524',bg1:'#f1dce4',bg2:'#e8b7ca'},
 {name:'SILVER',base:'#b9bdc4',light:'#f4f6f8',dark:'#747a84',ink:'#26282c',bg1:'#e4e5e6',bg2:'#c7c9cc'},
 {name:'LAVA',base:'#ee5d45',light:'#ffb29e',dark:'#922f24',ink:'#34120e',bg1:'#ead2ca',bg2:'#cd9c90'},
 {name:'INK',base:'#34333b',light:'#83818f',dark:'#17171b',ink:'#08080a',bg1:'#dedce4',bg2:'#bdb9c9'}
];
const archetypes=[
 {name:'KIDNEY',pts:[[49,8],[68,12],[82,27],[77,43],[69,53],[78,69],[68,86],[49,93],[30,88],[18,73],[20,55],[17,37],[27,18]]},
 {name:'TALL',pts:[[50,6],[65,11],[73,24],[71,41],[67,54],[73,70],[64,88],[49,95],[34,90],[26,76],[28,59],[24,42],[29,22],[39,10]]},
 {name:'SQUAT',pts:[[49,14],[69,14],[84,26],[87,42],[76,53],[81,67],[68,81],[48,87],[28,82],[14,68],[20,52],[13,39],[21,24],[35,15]]},
 {name:'BENT',pts:[[43,8],[61,10],[76,21],[79,35],[70,47],[67,58],[78,71],[72,85],[55,93],[37,89],[25,77],[24,61],[16,48],[20,31],[30,16]]},
 {name:'PEAR',pts:[[50,9],[64,13],[72,25],[70,39],[65,49],[79,63],[78,78],[64,90],[47,94],[28,87],[17,73],[20,56],[22,41],[28,24],[39,13]]},
 {name:'DOUBLE',pts:[[49,8],[66,11],[79,23],[80,38],[70,49],[80,60],[79,76],[66,89],[49,94],[31,89],[19,76],[20,60],[30,49],[20,38],[21,23],[34,11]]}
];
function hash(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}h+=h<<13;h^=h>>>7;h+=h<<3;h^=h>>>17;h+=h<<5;return h>>>0}
function rng(seed){let a=hash(String(seed));return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const n=(r,a,b)=>a+(b-a)*r(),pick=(r,a)=>a[Math.floor(r()*a.length)];
function smoothPath(p){let d=`M ${p[0][0]} ${p[0][1]}`,L=p.length;for(let i=0;i<L;i++){let p0=p[(i-1+L)%L],p1=p[i],p2=p[(i+1)%L],p3=p[(i+2)%L],c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];d+=` C ${c1[0].toFixed(2)} ${c1[1].toFixed(2)}, ${c2[0].toFixed(2)} ${c2[1].toFixed(2)}, ${p2[0].toFixed(2)} ${p2[1].toFixed(2)}`}return d+' Z'}
function body(seed){const r=rng(seed+'body-v2'),type=Math.floor(r()*archetypes.length),arch=archetypes[type],sx=n(r,.94,1.06),sy=n(r,.95,1.055),lean=n(r,-3.2,3.2),wobble=n(r,.6,1.7);const pts=arch.pts.map((p,i)=>{const edge=i===0?0.45:1;return[50+(p[0]-50)*sx+lean*(p[1]-50)/45+n(r,-wobble,wobble)*edge,50+(p[1]-50)*sy+n(r,-wobble*.75,wobble*.75)*edge]});return {d:smoothPath(pts),name:arch.name,lean}}
function face(seed,ink){const r=rng(seed+'face-v2'),style=Math.floor(r()*6),gap=n(r,13,18),y=n(r,43,48),size=n(r,4.4,6.2),pupil=n(r,1.8,2.6),look=n(r,-1.5,1.5),x1=50-gap/2,x2=50+gap/2;let out='';const eye=(x,ry=1)=>`<ellipse cx="${x}" cy="${y}" rx="${size*.78}" ry="${size*ry}" fill="#fff" stroke="${ink}" stroke-width="1.55"/><circle cx="${x+look}" cy="${y+.5}" r="${pupil}" fill="${ink}"/><circle cx="${x+look-.7}" cy="${y-.45}" r=".72" fill="#fff"/>`;if(style===0)out=eye(x1)+eye(x2);if(style===1)out=`<path d="M${x1-size*.8} ${y} Q${x1} ${y+2.5} ${x1+size*.8} ${y}" fill="#fff" stroke="${ink}" stroke-width="1.7" stroke-linecap="round"/>`+`<path d="M${x2-size*.8} ${y} Q${x2} ${y+2.5} ${x2+size*.8} ${y}" fill="#fff" stroke="${ink}" stroke-width="1.7" stroke-linecap="round"/>`;if(style===2)out=eye(x1,1.2)+eye(x2,1.2)+`<path d="M${x1-5} ${y-9}Q${x1} ${y-11} ${x1+5} ${y-9}M${x2-5} ${y-9}Q${x2} ${y-11} ${x2+5} ${y-9}" fill="none" stroke="${ink}" stroke-width="1.6" stroke-linecap="round"/>`;if(style===3)out=`<ellipse cx="50" cy="${y}" rx="${size*1.12}" ry="${size*1.25}" fill="#fff" stroke="${ink}" stroke-width="1.7"/><circle cx="${50+look}" cy="${y+.5}" r="${pupil+1}" fill="${ink}"/><circle cx="${49.2+look}" cy="${y-.7}" r=".85" fill="#fff"/>`;if(style===4)out=eye(x1,.72)+eye(x2,.72)+`<path d="M${x1-5} ${y-7}L${x1+4} ${y-8.5}M${x2-4} ${y-8.5}L${x2+5} ${y-7}" stroke="${ink}" stroke-width="1.7" stroke-linecap="round"/>`;if(style===5)out=`<path d="M${x1-5} ${y+1}Q${x1} ${y-3} ${x1+5} ${y+1}" fill="none" stroke="${ink}" stroke-width="2.2" stroke-linecap="round"/><path d="M${x2-5} ${y+1}Q${x2} ${y-3} ${x2+5} ${y+1}" fill="none" stroke="${ink}" stroke-width="2.2" stroke-linecap="round"/>`;return {svg:out,name:['ROUND','SLEEPY','WIDE','CYCLOPS','SIDE-EYE','SQUINT'][style],y}}
function mouth(seed,ink){const r=rng(seed+'mouth-v2'),s=Math.floor(r()*6),y=n(r,59,66),w=n(r,7.5,12);if(s===0)return {name:'SMILE',svg:`<path d="M${50-w} ${y}Q50 ${y+8} ${50+w} ${y}" fill="none" stroke="${ink}" stroke-width="2.2" stroke-linecap="round"/>`};if(s===1)return {name:'SMIRK',svg:`<path d="M${50-w} ${y+2}Q51 ${y+4} ${50+w} ${y-2}" fill="none" stroke="${ink}" stroke-width="2.2" stroke-linecap="round"/>`};if(s===2)return {name:'O',svg:`<ellipse cx="50" cy="${y+2}" rx="${w*.48}" ry="${w*.62}" fill="${ink}"/><ellipse cx="49" cy="${y}" rx="${w*.2}" ry="${w*.18}" fill="#fff" opacity=".32"/>`};if(s===3)return {name:'FLAT',svg:`<path d="M${50-w} ${y}H${50+w}" stroke="${ink}" stroke-width="2.4" stroke-linecap="round"/>`};if(s===4)return {name:'TOOTHY',svg:`<path d="M${50-w} ${y-1}Q50 ${y+10} ${50+w} ${y-1}Q50 ${y+16} ${50-w} ${y-1}Z" fill="#fff" stroke="${ink}" stroke-width="1.7"/><path d="M50 ${y+3}v7" stroke="${ink}" stroke-width="1" opacity=".45"/>`};return {name:'FROWN',svg:`<path d="M${50-w} ${y+4}Q50 ${y-4} ${50+w} ${y+4}" fill="none" stroke="${ink}" stroke-width="2.2" stroke-linecap="round"/>`}}
function surface(seed,pal){const r=rng(seed+'surface-v2'),s=Math.floor(r()*6);if(s===0)return {name:'CLEAN',svg:''};if(s===1)return {name:'FRECKLES',svg:`<g fill="${pal.ink}" opacity=".28"><circle cx="35" cy="58" r="1.1"/><circle cx="39" cy="60" r=".75"/><circle cx="64" cy="58" r=".9"/><circle cx="68" cy="60" r=".7"/></g>`};if(s===2)return {name:'SPOTS',svg:`<g fill="${pal.light}" opacity=".48"><circle cx="32" cy="29" r="5.3"/><circle cx="70" cy="70" r="3.7"/><circle cx="28" cy="73" r="2.4"/></g>`};if(s===3)return {name:'BROW PATCH',svg:`<path d="M29 30Q39 23 48 28Q41 35 31 36Z" fill="${pal.dark}" opacity=".18"/>`};if(s===4)return {name:'STRIPE',svg:`<path d="M27 70Q39 78 50 71T75 68" fill="none" stroke="${pal.light}" stroke-width="5.5" opacity=".38" stroke-linecap="round"/>`};return {name:'BEAUTY MARK',svg:`<circle cx="65" cy="58" r="1.6" fill="${pal.ink}" opacity=".62"/>`}}
function make(seed){const styleR=rng(seed+'style-v2'),pal=pick(styleR,palettes),b=body(seed),f=face(seed,pal.ink),m=mouth(seed,pal.ink),s=surface(seed,pal),rot=n(styleR,-3.5,3.5).toFixed(2),material=pick(styleR,['SOFT','GUMMY','SATIN']);const uid='b'+hash(String(seed)+'uid').toString(36),shine=material==='GUMMY'?.48:material==='SATIN'?.30:.20,shadow=material==='SOFT'?.18:.26;const svg=`<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="Bean ${seed}"><defs><linearGradient id="${uid}body" x1="18%" y1="8%" x2="82%" y2="92%"><stop offset="0" stop-color="${pal.light}"/><stop offset=".32" stop-color="${pal.base}"/><stop offset="1" stop-color="${pal.dark}"/></linearGradient><radialGradient id="${uid}glow" cx="29%" cy="18%" r="63%"><stop offset="0" stop-color="#fff" stop-opacity="${shine}"/><stop offset=".58" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><clipPath id="${uid}clip"><path d="${b.d}"/></clipPath><filter id="${uid}blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.2"/></filter><filter id="${uid}shadow" x="-30%" y="-20%" width="170%" height="180%"><feDropShadow dx="0" dy="3.2" stdDeviation="2.4" flood-color="${pal.ink}" flood-opacity=".22"/></filter></defs><g transform="rotate(${rot} 50 50)" filter="url(#${uid}shadow)"><path d="${b.d}" fill="url(#${uid}body)" stroke="${pal.ink}" stroke-width="1.8" stroke-linejoin="round"/><g clip-path="url(#${uid}clip)"><ellipse cx="28" cy="18" rx="33" ry="28" fill="url(#${uid}glow)"/><ellipse cx="77" cy="61" rx="18" ry="31" fill="${pal.ink}" opacity="${shadow}" filter="url(#${uid}blur)"/><path d="M24 19Q36 10 49 13" fill="none" stroke="#fff" stroke-width="3.8" opacity="${shine}" stroke-linecap="round"/>${s.svg}</g>${f.svg}${m.svg}${styleR()>.52?`<g fill="#ffb1b1" opacity=".18"><ellipse cx="32" cy="${f.y+10}" rx="5" ry="2.4"/><ellipse cx="68" cy="${f.y+10}" rx="5" ry="2.4"/></g>`:''}</g></svg>`;const bg=`radial-gradient(circle at 28% 16%,rgba(255,255,255,.82),transparent 30%),linear-gradient(145deg,${pal.bg1},${pal.bg2})`;return {svg,bg,traits:`${b.name} · ${pal.name} · ${f.name} · ${material}`}}
function show(seed,anim=true){const x=make(seed),h=document.getElementById('hero');h.style.background=x.bg;h.innerHTML=x.svg;if(anim)h.firstElementChild.classList.add('pop');document.getElementById('name').textContent='BEAN #'+seed;document.getElementById('traits').textContent=x.traits;document.getElementById('seed').value=seed}
function fill(base){const g=document.getElementById('grid');g.innerHTML='';let start=Number(base)||1;for(let i=0;i<12;i++){let seed=String(start+i),x=make(seed),c=document.createElement('div');c.className='card';c.style.background=x.bg;c.innerHTML=x.svg+`<span>#${seed}</span>`;c.onclick=()=>show(seed);g.appendChild(c)}}
document.getElementById('use').onclick=()=>{let s=document.getElementById('seed').value.trim()||'1';show(s);fill(s)};
document.getElementById('random').onclick=()=>{let s=Math.floor(Math.random()*99999)+1;show(s);fill(s)};
document.getElementById('seed').onkeydown=e=>{if(e.key==='Enter')document.getElementById('use').click()};
show('420',false);fill(420);
</script></body></html>
